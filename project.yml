name: ReviewDock
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  postGenCommand: python3 scripts/embed-watch.py
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "今日复习"
targets:
  ReviewDock:
    type: application
    platform: iOS
    sources: [Shared, iPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewdock.study
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ReviewDockWatch
        embed: true
  ReviewDockWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewdock.study.watchkitapp
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.reviewdock.study
schemes:
  ReviewDock:
    build:
      targets:
        ReviewDock: all
